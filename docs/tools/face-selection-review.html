<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秀燕姐退休紀念・找找你的Q版照片</title>
<style>
  :root { --bg:#14120e; --panel:#1e1b15; --panel2:#262218; --gold:#C9A84C; --text:#FFF8EC; --dim:#9a8f78;
          --keep:#5ad06a; --rej:#e05a4a; --blur:#ff8a3d; --herself:#ff5fa8; --scan-duration:1.4s; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:"Noto Sans TC",sans-serif; margin:0; }
  header {
    position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:2px solid var(--gold);
    padding:12px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  h1 { color:var(--gold); font-size:16px; margin:0; white-space:nowrap; }
  .stat { font-size:13px; color:var(--dim); }
  .stat b { color:var(--gold); }
  .legend { display:flex; gap:16px; font-size:12px; color:var(--dim); flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .swatch { width:14px; height:14px; border-radius:3px; display:inline-block; }
  input#search {
    background:var(--panel2); color:var(--text); border:1px solid #4a4232; border-radius:6px;
    padding:6px 10px; font-size:13px; width:160px;
  }
  #copyBtn {
    background:var(--herself); color:#1a0d13; border:none; border-radius:6px;
    padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;
  }
  #copyBtn:active { opacity:0.8; }
  main { max-width:1400px; margin:0 auto; padding:16px; }
  .card {
    background:var(--panel); border:1px solid #3a3428; border-radius:10px; margin-bottom:20px; overflow:hidden;
  }
  .card-head {
    padding:8px 14px; display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--dim); border-bottom:1px solid #3a3428;
  }
  .card-head b { color:var(--text); font-family:monospace; }
  .card-body { display:flex; align-items:flex-start; }
  /* imgwrap 的高度改用 JS 算出的 aspect-ratio 明確撐開，
     不要讓 img 用 height:auto 撐開父層高度再讓 svg 用 height:100% 去繼承——
     absolutely-positioned 子元素的百分比高度，在「父層高度由auto內容決定」時，
     不同瀏覽器引擎（尤其 iOS Safari）計算結果不一致，手機版標註框跑掉就是這樣來的 */
  /* 預設先給一個比例，圖片真正載入前容器就不會是0高度——
     img 改成 absolute 後不再靠自己撐開父層，若容器是0高度，
     loading="lazy" 的瀏覽器判斷邏輯甚至可能永遠不觸發載入（雞生蛋問題） */
  .imgwrap { position:relative; flex:1 1 auto; min-width:0; background:#000; line-height:0; aspect-ratio: 4 / 3; }
  .imgwrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  .imgwrap svg { position:absolute; inset:0; width:100%; height:100%; }
  .thumb-col {
    flex:0 0 320px; width:320px; max-height:640px; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px; padding:14px; border-left:1px solid #3a3428;
  }
  /* 預覽模式的縮圖排成可換行的網格，不用 .thumb-pair 那種「裁切→Q版」對照排法
     （那是給我審核用的，一般參加者只需要看到自己的Q版結果） */
  body:not(.edit-mode) .thumb-col { flex-direction:row; flex-wrap:wrap; align-content:flex-start; justify-content:center; row-gap:20px; }
  .thumb-pair { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .thumb-row { display:flex; align-items:center; gap:6px; }
  .thumb-item { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .thumb-item img {
    width:84px; height:84px; object-fit:cover; border-radius:8px; border:2px solid var(--keep); background:#000;
  }
  .thumb-item:first-child img { border-color:var(--gold); }
  .thumb-item span { font-size:10px; color:var(--dim); }
  .thumb-item.missing img { display:none; }
  .thumb-item.missing::before {
    content:'找不到圖片'; display:block; width:84px; height:84px; line-height:84px; text-align:center;
    font-size:11px; color:var(--rej); background:var(--panel2); border-radius:8px;
  }
  .thumb-arrow { color:var(--dim); font-size:18px; }
  .herself-toggle {
    margin-top:2px; font-size:11px; padding:3px 8px; border-radius:5px; cursor:pointer;
    background:var(--panel2); color:var(--dim); border:1px solid #4a4232; white-space:nowrap;
  }
  .herself-toggle.on { background:var(--herself); color:#1a0d13; border-color:var(--herself); font-weight:700; }
  .dl-btn {
    margin-top:2px; font-size:11px; padding:3px 8px; border-radius:5px; cursor:pointer;
    background:var(--panel2); color:var(--gold); border:1px solid var(--gold); white-space:nowrap;
    text-decoration:none; display:inline-block;
  }
  .dl-btn:hover { background:var(--gold); color:#1a1509; }
  .thumb-pair.is-herself img { border-color:var(--herself) !important; }
  /* 預覽模式的簡化卡片：桌面版只顯示Q版大頭貼＋下載按鈕（裁切對照是手機版
     專屬的兩列上下對照效果，見下面 @media 區塊），沒有標記按鈕 */
  .simple-avatar { display:flex; flex-direction:column; align-items:center; gap:4px; width:100px; }
  .simple-avatar .pair-imgs {
    display:flex; flex-direction:column; align-items:center;
    background:none; border:none; padding:0; margin:0; cursor:pointer; /* 重置 <button> 預設樣式 */
  }
  .simple-avatar .pair-imgs img:first-child,
  .simple-avatar .pair-divider { display:none; } /* 桌面版不顯示原圖裁切對照，只保留在手機版 */
  .simple-avatar .pair-imgs img {
    width:100px; height:100px; object-fit:cover; border-radius:10px; border:2px solid var(--keep); background:#000;
  }
  /* 原圖裁切用金框跟Q版做區隔，一眼看出上下兩張圖的角色不同 */
  .simple-avatar .pair-imgs img:first-child { border-color:var(--gold); }
  .simple-avatar.is-herself .pair-imgs img { border-color:var(--herself) !important; border-width:3px; }
  .simple-avatar .who {
    font-size:10px; color:var(--dim); width:100%; text-align:center;
    white-space:normal; word-break:keep-all; line-height:1.3;
  }
  .simple-avatar.is-herself .who { color:var(--herself); font-weight:700; }
  /* 下方頭像預覽跟主畫面的掃描辨識同一個觸發時機，一個接一個浮現，
     呼應「照片正在被逐一識別出來」的感覺，不是掃描完就整排一次全部跳出來 */
  .simple-avatar.revealable { opacity:0; transform:translateY(10px); animation:avatarReveal .45s ease forwards; animation-play-state:paused; }
  .card.revealed .simple-avatar.revealable { animation-play-state:running; }
  @keyframes avatarReveal {
    to { opacity:1; transform:translateY(0); }
  }
  /* 標題編輯／模式切換：故意做得不顯眼（小按鈕靠右），公開版訪客不會誤點，
     但我自己還是找得到，不用另外開一份工具檔 */
  .mode-toggle {
    margin-left:auto; font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer;
    background:var(--panel2); color:var(--dim); border:1px solid #4a4232; white-space:nowrap;
  }
  .mode-toggle:hover { color:var(--text); border-color:var(--gold); }
  body:not(.edit-mode) .admin-only { display:none !important; }
  body.edit-mode #previewLegend { display:none !important; }
  @media (max-width: 900px) {
    header { padding:10px 14px; gap:10px; }
    h1 { font-size:14px; white-space:normal; }
    .card-body { flex-direction:column; }
    /* .card-body 的 align-items:flex-start 在 column 模式下管的是「橫軸」(寬度)，
       預設不會 stretch。.thumb-col 本來就有明確設定 width:100% 才能正常顯示，
       .imgwrap 漏了同樣設定，寬度會塌陷成0，aspect-ratio 也就跟著算成0——
       這就是主圖在手機版完全消失的真正原因 */
    .imgwrap { width:100%; }
    .thumb-col { flex:1 1 auto; width:100%; max-height:none; border-left:none; border-top:1px solid #3a3428; }
    /* 編輯模式（審核用）維持置中換行網格，不受下面預覽模式的水平捲動改版影響 */
    body.edit-mode .thumb-col { flex-direction:row; flex-wrap:wrap; justify-content:center; row-gap:20px; }
    /* 編輯模式沿用的縮圖尺寸（換行網格） */
    body.edit-mode .simple-avatar { width:84px; }
    body.edit-mode .simple-avatar img { width:84px; height:84px; }

    /* 預覽模式：每個人一張卡片，上面原圖裁切、下面Q版成果「兩列上下對照」，
       卡片橫向排成可捲動輪播——人多的合照直排要捲很長，橫向配合下面的
       點擊定位，體驗更像滑照片牆，找自己也更快。 */
    body:not(.edit-mode) .thumb-col {
      display:flex; flex-direction:row; align-items:flex-start; flex-wrap:nowrap;
      /* safe center：人少（總寬度小於容器）時置中排列比較好看；人多會溢出，
         safe 讓瀏覽器自動退回 flex-start，不會把最前面的人擠到畫面外去 */
      justify-content:safe center;
      overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      scroll-snap-type:x proximity; scroll-padding-inline:24px;
      gap:14px; row-gap:0;
      /* 左右留白刻意留到「快接近容器一半寬度」，第一顆／最後一顆頭像才有
         足夠捲動空間被真的捲到正中央——不然邊緣那幾顆再怎麼捲也到不了
         viewport 中心，聚焦縮放效果就會落在旁邊那顆，讓人以為認錯人。
         84px 頭像卡片的一半是42px，扣掉這個寬度才是真正需要留的空間。 */
      padding-block:30px; padding-inline:calc(50% - 42px);
      /* 左右邊緣淡出，暗示還可以繼續往兩邊滑 */
      mask-image:linear-gradient(to right, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
      -webkit-mask-image:linear-gradient(to right, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
    }
    body:not(.edit-mode) .thumb-col::-webkit-scrollbar { height:5px; }
    body:not(.edit-mode) .thumb-col::-webkit-scrollbar-track { background:transparent; }
    body:not(.edit-mode) .thumb-col::-webkit-scrollbar-thumb { background:var(--gold); border-radius:3px; }
    body:not(.edit-mode) .simple-avatar {
      flex:0 0 auto; width:84px; scroll-snap-align:center;
      transition:transform .2s ease, opacity .2s ease;
      backface-visibility:hidden; /* 3D旋轉角度不大不會真的翻到背面，純保險 */
    }
    body:not(.edit-mode) .simple-avatar .pair-imgs { display:flex; flex-direction:column; gap:4px; }
    body:not(.edit-mode) .simple-avatar .pair-imgs img { width:84px; height:84px; }
    body:not(.edit-mode) .simple-avatar .pair-imgs img:first-child { display:block; } /* 手機版重新顯示原圖裁切 */
    /* 上下兩張圖之間的小箭頭，暗示「原圖 → Q版」的轉換關係，比單純疊在一起更好懂 */
    body:not(.edit-mode) .pair-divider {
      display:flex; align-items:center; justify-content:center; height:0; position:relative;
    }
    body:not(.edit-mode) .pair-divider::before {
      content:'▾'; position:absolute; top:-11px; left:50%; transform:translateX(-50%);
      color:var(--gold); font-size:13px; background:var(--panel2); border-radius:50%;
      width:18px; height:18px; line-height:18px; text-align:center;
    }
  }
  /* 點原圖上的框，對應的Q版頭像卡片會捲到正中央並短暫脈動一下，讓使用者
     一眼看出「就是這個人」——用 box-shadow 擴散淡出模擬漣漪，比單純變色明顯。
     顏色故意選跟畫面上其他固定色塊（金框=原圖裁切、粉紅=秀燕姐本人）都不一樣
     的亮青色，且用更大的漲縮幅度＋更長時間，才不會跟旁邊本來就有的金框混在
     一起看不出來「剛剛亮的是這個」——這正是使用者回報「反應的照片不是本人」
     的根因：不是真的點錯人，是脈動效果太不明顯，使用者分不出哪個亮過 */
  @keyframes avatarPing {
    0% { box-shadow:0 0 0 0 rgba(90,208,255,0.9); transform:scale(1); }
    35% { box-shadow:0 0 0 14px rgba(90,208,255,0); transform:scale(1.16); }
    100% { box-shadow:0 0 0 0 rgba(90,208,255,0); transform:scale(1); }
  }
  .simple-avatar.ping { animation:avatarPing 1.1s cubic-bezier(.34,1.56,.64,1); border-radius:10px; position:relative; z-index:3; }
  .simple-avatar.ping .pair-imgs img { outline:3px solid #5ad0ff; outline-offset:2px; }
  .rect-keep, .rect-herself {
    /* pointer-events:all 讓整個框（含fill:none的內部空白）都能點擊，不用只點在描邊線上 */
    fill:none; stroke:var(--keep); stroke-width:6; cursor:pointer; pointer-events:all;
  }
  .rect-herself { stroke:var(--herself); stroke-width:8; }
  .rect-rej { fill:none; stroke:var(--rej); stroke-width:5; stroke-dasharray:14 10; }
  .rect-crop { fill:none; stroke:var(--gold); stroke-width:3; stroke-dasharray:6 8; opacity:0.85; }
  .rect-blur { fill:var(--blur); opacity:0.38; }
  /* 雙向綁定：不管是點主圖上的框、還是在下方輪播滑到別人，兩邊都要同步
     標出「現在對應的是誰」。跟 rect-keep（綠）、rect-herself（粉紅）都不同
     顏色，沿用 ping／輪播聚焦效果同一套亮青色，讓使用者知道這是同一組
     互動邏輯；用持續的呼吸光暈（不是一次性的 ping）表示「目前綁定」的
     持續狀態，跟「剛剛點擊」的瞬間反饋做出區隔。用 stroke-dasharray 加上
     淡淡的跑動效果，跟其餘固定不動的框一眼就能分辨。 */
  .rect-focused {
    stroke:#5ad0ff; stroke-width:8; stroke-dasharray:16 8;
    animation:focusPulse 1.6s ease-in-out infinite, focusMarch 1s linear infinite;
  }
  @keyframes focusPulse {
    0%, 100% { filter:drop-shadow(0 0 4px rgba(90,208,255,0.6)); }
    50% { filter:drop-shadow(0 0 11px rgba(90,208,255,0.95)); }
  }
  @keyframes focusMarch { to { stroke-dashoffset:-48; } }
  .label-bg { fill:rgba(0,0,0,0.65); }
  .label-text { fill:#fff; font-size:34px; font-family:monospace; }

  /* ===== 預覽模式「掃描辨識」進場效果 =====
     卡片捲到畫面裡才觸發（見 JS 的 IntersectionObserver），只播一次。
     做法：框跟分數一開始就畫在 DOM 裡（opacity:0 + animation-play-state:paused，
     每個框依掃描軸座標算好各自的 animation-delay），真正觸發時只是把
     animation-play-state 切成 running，所有元件的動畫會照已經算好的延遲
     依序播放——不用等交會才臨時計算或重建 DOM，切換瞬間就對得整整齊齊。

     桌機版是橫線由上到下縱掃（垂直方向的掃描動線）；手機版是直線由左到右
     橫掃（水平方向的掃描動線）。兩種方向對應的 JS 延遲基準也不同（見
     render() 裡的 scanDelay 判斷），斷點跟版面用的 900px 媒體查詢保持
     一致，不然框跟掃描線會對不準。 */
  .scan-line {
    position:absolute; top:0; bottom:auto; left:0; right:0; width:auto; height:3px; opacity:0; pointer-events:none;
    background:linear-gradient(to right, transparent, var(--keep) 15%, #eaffef 50%, var(--keep) 85%, transparent);
    box-shadow:0 0 12px 2px rgba(90,208,106,0.9), 0 0 30px 6px rgba(90,208,106,0.4);
  }
  .card.revealed .scan-line { animation:scanSweepY var(--scan-duration) ease-out forwards; }
  @keyframes scanSweepY {
    0% { top:0; opacity:0; }
    4% { opacity:1; }
    92% { opacity:1; }
    100% { top:100%; opacity:0; }
  }
  @media (max-width:900px) {
    .scan-line {
      top:0; bottom:0; left:0; right:auto; width:3px; height:auto;
      background:linear-gradient(to bottom, transparent, var(--keep) 15%, #eaffef 50%, var(--keep) 85%, transparent);
    }
    .card.revealed .scan-line { animation:scanSweepX var(--scan-duration) ease-out forwards; }
  }
  @keyframes scanSweepX {
    0% { left:0; opacity:0; }
    4% { opacity:1; }
    92% { opacity:1; }
    100% { left:100%; opacity:0; }
  }
  .rect-keep.revealable, .rect-herself.revealable {
    opacity:0; animation:boxReveal .5s ease forwards; animation-play-state:paused;
  }
  .card.revealed .rect-keep.revealable, .card.revealed .rect-herself.revealable { animation-play-state:running; }
  @keyframes boxReveal {
    0% { opacity:0; filter:drop-shadow(0 0 0 rgba(90,208,106,0)); }
    35% { opacity:1; filter:drop-shadow(0 0 8px rgba(90,208,106,0.9)); }
    100% { opacity:1; filter:drop-shadow(0 0 0 rgba(90,208,106,0)); }
  }
  .score-badge { opacity:0; animation:boxReveal .5s ease forwards; animation-play-state:paused; }
  .card.revealed .score-badge { animation-play-state:running; }
  .score-badge-bg { fill:rgba(10,20,12,0.82); stroke:var(--keep); stroke-width:1.5; }
  .rect-herself ~ .score-badge .score-badge-bg,
  .score-badge.for-herself .score-badge-bg { stroke:var(--herself); }
  .score-badge-text { fill:#eaffef; font-size:30px; font-family:monospace; font-weight:700; letter-spacing:1px; }
  .score-badge.for-herself .score-badge-text { fill:#ffd6ec; }

  #empty { text-align:center; color:var(--dim); padding:60px 20px; }

  /* 預覽模式點頭像不再直接下載，改開這個燈箱：先放大看清楚，確定要留
     再按下載——手機上常常誤觸，直接下載反而讓人搞不清楚存了什麼檔案 */
  .preview-modal {
    position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:24px;
  }
  .preview-modal.open { display:flex; }
  .preview-modal-backdrop {
    position:absolute; inset:0; background:rgba(10,8,5,0.8); animation:pmFade .18s ease;
  }
  .preview-modal-content {
    position:relative; z-index:1; width:100%; max-width:340px;
    background:var(--panel); border-radius:18px; padding:22px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    box-shadow:0 24px 60px rgba(0,0,0,0.55); animation:pmPop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .preview-modal-img {
    width:100%; aspect-ratio:1; object-fit:cover; border-radius:14px; border:3px solid var(--gold); background:#000;
  }
  .preview-modal-content.is-herself .preview-modal-img { border-color:var(--herself); }
  .preview-modal-label { font-size:13px; color:var(--dim); }
  .preview-modal-content.is-herself .preview-modal-label { color:var(--herself); font-weight:700; }
  .preview-modal-actions { display:flex; gap:10px; width:100%; }
  .preview-modal-dl, .preview-modal-close {
    flex:1; text-align:center; text-decoration:none; cursor:pointer; border:none;
    font-size:14px; font-weight:700; padding:11px 0; border-radius:99px;
  }
  .preview-modal-dl { background:var(--gold); color:#1a1509; }
  .preview-modal-close { background:var(--panel2); color:var(--dim); border:1px solid #4a4232; }
  @keyframes pmFade { from{opacity:0} to{opacity:1} }
  @keyframes pmPop { from{opacity:0; transform:scale(.9)} to{opacity:1; transform:scale(1)} }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">🌸 秀燕姐退休紀念 · 找找你的Q版照片</h1>
  <div class="stat">照片 <b id="photoCount">0</b> 張</div>
  <div class="stat admin-only">已選 <b id="keepCount" style="color:var(--keep)">0</b></div>
  <div class="stat admin-only">未選（偵測到但排除）<b id="rejCount" style="color:var(--rej)">0</b></div>
  <div class="stat admin-only">秀燕姐本人 <b id="herselfCount" style="color:var(--herself)">0</b></div>
  <input id="search" placeholder="搜尋檔名，例：s6-12">
  <label class="admin-only" style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--dim);cursor:pointer;">
    <input type="checkbox" id="onlyHerself">只顯示秀燕姐本人
  </label>
  <button id="copyBtn" class="admin-only" type="button">複製秀燕姐清單</button>
  <div class="legend admin-only">
    <span><span class="swatch" style="background:var(--keep)"></span>已選保留</span>
    <span><span class="swatch" style="background:var(--rej);border:2px dashed var(--rej);background:transparent"></span>偵測到但未選</span>
    <span><span class="swatch" style="background:transparent;border:2px dashed var(--gold)"></span>裁切擷取範圍</span>
    <span><span class="swatch" style="background:var(--blur);opacity:0.6"></span>會被模糊的重疊區</span>
    <span><span class="swatch" style="background:var(--herself)"></span>標記為秀燕姐本人</span>
  </div>
  <div class="legend" id="previewLegend">
    <span><span class="swatch" style="background:var(--herself)"></span>秀燕姐本人</span>
  </div>
  <button id="modeToggle" class="mode-toggle" type="button">🔧 編輯模式</button>
</header>

<main id="main"></main>
<div id="empty" style="display:none">沒有符合的照片</div>

<div id="previewModal" class="preview-modal">
  <div class="preview-modal-backdrop"></div>
  <div class="preview-modal-content" id="previewModalContent">
    <img class="preview-modal-img" id="previewModalImg" src="" alt="Q版大頭貼">
    <span class="preview-modal-label" id="previewModalLabel"></span>
    <div class="preview-modal-actions">
      <a class="preview-modal-dl" id="previewModalDl" href="" download>⬇ 下載照片</a>
      <button type="button" class="preview-modal-close" id="previewModalCloseBtn">關閉</button>
    </div>
  </div>
</div>

<script>
const CROP_PAD_RATIO = 1.9; // 需與 scripts/faceCrop.py / buildHeartCollage.py 一致
const SCAN_DURATION_S = 1.4; // 要跟 CSS 的 --scan-duration 對到同一個數字，掃描線速度跟框的延遲才會同步
const AVATAR_STAGGER_S = 0.09; // 下方頭像預覽一個接一個浮現的間隔

function overlapRect(a, b) {
  // a, b: [x,y,w,h]；回傳交集矩形或 null
  const ax0 = a[0], ay0 = a[1], ax1 = a[0]+a[2], ay1 = a[1]+a[3];
  const bx0 = b[0], by0 = b[1], bx1 = b[0]+b[2], by1 = b[1]+b[3];
  const ix0 = Math.max(ax0,bx0), iy0 = Math.max(ay0,by0);
  const ix1 = Math.min(ax1,bx1), iy1 = Math.min(ay1,by1);
  if (ix1 <= ix0 || iy1 <= iy0) return null;
  return [ix0, iy0, ix1-ix0, iy1-iy0];
}

function paddedCropRect(box) {
  const [x,y,w,h] = box;
  const cx = x + w/2, cy = y + h/2;
  const side = Math.max(w,h) * CROP_PAD_RATIO;
  return [cx - side/2, cy - side/2, side, side];
}

// 標記「這張照片裡哪一個候選框是秀燕姐本人」——每張照片最多一個，所以用
// file -> avatarIdx 的物件就好，不用陣列。存在瀏覽器 localStorage，重新整理
// 頁面也不會不見；但 localStorage 是各網域獨立的，本機（localhost）標記過的
// 結果不會出現在外網（github.io）開的同一頁面上，所以第一次載入（本機沒標記
// 過）會 fallback 抓 data/herself-marks.json 這份已確認過的清單當初始值，
// 之後才用 localStorage 接手（讓使用者仍可以繼續新增/修改標記）。
const HERSELF_KEY = 'face-review-herself-marks-v1';
async function loadHerselfMarks() {
  try {
    const raw = localStorage.getItem(HERSELF_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  let seed = {};
  try { seed = await fetch('../data/herself-marks.json').then(r => r.ok ? r.json() : {}); } catch {}
  saveHerselfMarks(seed);
  return seed;
}
function saveHerselfMarks(marks) {
  localStorage.setItem(HERSELF_KEY, JSON.stringify(marks));
}

// 編輯模式（我審核用）／預覽模式（大家找自己Q版照片用）切換，記在 localStorage
// 讓我下次打開不用重新切換，但預設是預覽模式——公開版訪客打開來就是乾淨的畫面。
const EDIT_MODE_KEY = 'face-review-edit-mode-v1';
function isEditMode() {
  return localStorage.getItem(EDIT_MODE_KEY) === '1';
}
function setEditMode(on) {
  localStorage.setItem(EDIT_MODE_KEY, on ? '1' : '0');
  document.body.classList.toggle('edit-mode', on);
  document.getElementById('modeToggle').textContent = on ? '👀 預覽模式' : '🔧 編輯模式';
}

async function main() {
  const [detections, selection, photoDims] = await Promise.all([
    fetch('../data/face-detections.json').then(r => r.json()),
    fetch('../data/face-selection.json').then(r => r.json()),
    // 框選座標是對「原圖」算出來的，但這裡載入的是網頁壓縮版照片（解析度不同，
    // 只是同比例縮小），要用原圖尺寸當 SVG viewBox 座標系，框才不會偏移到畫面外
    fetch('../data/photo-dimensions.json').then(r => r.json()),
  ]);

  // key -> keepFiles 陣列中的原始 index，對應 scripts/generateQAvatars.py 產生的
  // assets/generated/qavatar-crops/<idx>.jpg 與 assets/generated/qavatars/<idx>.png
  const idxByKey = new Map();
  selection.keepFiles.forEach((f, i) => idxByKey.set(f.file + '|' + JSON.stringify(f.box), i));

  const byFile = {};
  for (const d of detections) {
    (byFile[d.file] ??= { keep: [], reject: [] });
    const key = d.file + '|' + JSON.stringify(d.box);
    if (idxByKey.has(key)) {
      d.avatarIdx = idxByKey.get(key);
      byFile[d.file].keep.push(d);
    } else {
      byFile[d.file].reject.push(d);
    }
  }

  const files = Object.keys(byFile).sort();
  document.getElementById('photoCount').textContent = files.length;
  document.getElementById('keepCount').textContent = selection.keepFiles.length;
  document.getElementById('rejCount').textContent = detections.length - selection.keepFiles.length;

  const herselfMarks = await loadHerselfMarks(); // file -> avatarIdx
  function updateHerselfCount() {
    document.getElementById('herselfCount').textContent = Object.keys(herselfMarks).length;
  }
  updateHerselfCount();

  // 按鈕跟直接點照片上的框，共用同一套切換邏輯——每張照片最多一個本人，
  // 點已標記的取消，點別的自動蓋掉同張照片的舊標記。
  function toggleHerself(file, avatarIdx) {
    if (herselfMarks[file] === avatarIdx) {
      delete herselfMarks[file];
    } else {
      herselfMarks[file] = avatarIdx;
    }
    saveHerselfMarks(herselfMarks);
    updateHerselfCount();
    render(currentFilter); // 重繪讓同張照片其他候選框的標記狀態同步更新
  }

  const main = document.getElementById('main');
  let currentFilter = '';

  // ===== 雙向綁定：主圖框 <-> 下方聚焦頭像 =====
  // 正方向（點框）：scrollToAvatar 呼叫。反方向（在輪播滑到別人，不點框）：
  // applyCoverflow 每次重算時，順便找出目前離中心最近的頭像回呼這裡。
  // 兩個方向最後都收斂到同一個函式，確保畫面上「框」跟「聚焦卡片」
  // 任何時候都指向同一個人，不會各自為政。
  let focusedAvatarIdx = null;
  function setFocusedAvatar(avatarIdx) {
    if (avatarIdx === focusedAvatarIdx) return;
    if (focusedAvatarIdx !== null) {
      const prev = document.querySelector(`rect[data-avatar-idx="${focusedAvatarIdx}"]`);
      if (prev) prev.classList.remove('rect-focused');
    }
    const next = document.querySelector(`rect[data-avatar-idx="${avatarIdx}"]`);
    if (next) next.classList.add('rect-focused');
    focusedAvatarIdx = avatarIdx;
  }

  // 點原圖上的框，把對應的Q版頭像捲到「兩列橫向輪播」正中央並脈動一下——
  // inline:'center' 對水平捲動容器有效，block:'nearest' 避免連帶捲動整個頁面。
  function scrollToAvatar(avatarIdx) {
    const el = document.querySelector(`.simple-avatar[data-avatar-idx="${avatarIdx}"]`);
    if (!el) return;
    // 保險：萬一淡入動畫還沒播完就被點到（正常情況下不會，因為使用者要先看到
    // 主圖上的框，代表這張卡片一定已經 revealed 過），直接鎖定顯示狀態，
    // 確保加 .ping 不會意外把還在跑的 avatarReveal 動畫換掉導致頭像消失。
    // 只在還沒 revealed 完成時才動 transform——已經 revealed 的頭像可能正
    // 套著輪播聚焦效果的縮放，這裡不該直接歸零蓋掉它。
    if (el.classList.contains('revealable')) {
      el.classList.remove('revealable');
      el.style.opacity = '1';
      el.style.transform = 'none';
    }
    el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    // 先把「其他」還留著 .ping 的頭像清掉——ping 動畫只有0.8秒但沒設 forwards，
    // 播完外觀會自己歸零，可是 class 本身不會自動移除。連續快速點好幾個框
    // （不到0.8秒點下一個）時，上一個還在播的glow沒被清掉，會跟新的同時
    // 亮著，讓人搞不清楚「現在到底是哪一個」在回應，誤以為反應的是別人。
    // 同一時間只允許一個頭像在 ping，才不會有這種疊加造成的錯覺。
    document.querySelectorAll('.simple-avatar.ping').forEach(other => {
      if (other !== el) other.classList.remove('ping');
    });
    el.classList.remove('ping');
    void el.offsetWidth; // 強制 reflow，同一顆頭像連續點兩次也能重新觸發動畫
    el.classList.add('ping');
    setFocusedAvatar(avatarIdx); // 正方向綁定：點框當下就先標出對應的框，不用等捲動完成
  }

  // ===== 手機版輪播「聚焦」效果（立體版） =====
  // 點框跳到中間那張卡片放大、離中心越遠的卡片越小越淡，並加上 rotateY
  // 讓兩側卡片像實體卡片一樣往內側旋轉、退到景深後方，變成真的有前後
  // 層次的立體聚焦，不是單純平面放大。公式只吃「跟輪播容器中心的水平
  // 距離＋方向」，不用管一張照片裡到底有幾個人（1個到10幾個都遇過）——
  // 人少時大家都靠近中心，縮放/旋轉差異自然不明顯；人多時捲動範圍變大，
  // 離中心遠的自然被縮小、旋轉、淡化，反而幫忙把視覺焦點留在正中央那一位，
  // 不用另外為不同數量寫不同的版面規則。
  // 只在手機版單排輪播啟用；桌機版是換行網格，沒有「中心」這個概念。
  const COVERFLOW_MAX_SCALE = 1.22;
  const COVERFLOW_MIN_SCALE = 0.8;
  const COVERFLOW_MIN_OPACITY = 0.5;
  const COVERFLOW_MAX_ROTATE = 30; // deg，兩側卡片最大旋轉角度
  const COVERFLOW_PERSPECTIVE = 700; // px，用 transform 內建的 perspective()，不影響捲動容器本身的堆疊環境

  function applyCoverflow(thumbCol) {
    if (window.innerWidth > 900) return;
    const rect = thumbCol.getBoundingClientRect();
    if (!rect.width) return;
    const centerX = rect.left + rect.width / 2;
    const halfWidth = rect.width / 2;
    let closestIdx = null;
    let closestNorm = Infinity;
    thumbCol.querySelectorAll(':scope > .simple-avatar').forEach((el) => {
      const r = el.getBoundingClientRect();
      const elCenterX = r.left + r.width / 2;
      const dx = elCenterX - centerX;
      const norm = Math.min(Math.abs(dx) / halfWidth, 1);
      const side = dx < 0 ? -1 : 1; // 中心左邊 -1、右邊 1
      const scale = COVERFLOW_MAX_SCALE - norm * (COVERFLOW_MAX_SCALE - COVERFLOW_MIN_SCALE);
      const opacity = 1 - norm * (1 - COVERFLOW_MIN_OPACITY);
      // 反號：讓兩側卡片朝中心「內側」的那條邊往螢幕外傾，視覺上像
      // 圍繞中心卡片往內收攏的一圈立體卡片牆，不是隨機往同一邊倒
      const rotateY = -side * norm * COVERFLOW_MAX_ROTATE;
      el.style.transform =
        `perspective(${COVERFLOW_PERSPECTIVE}px) rotateY(${rotateY.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
      el.style.opacity = opacity.toFixed(3);
      el.style.zIndex = String(Math.round((1 - norm) * 100)); // 中間的疊在最上面，才不會被兩旁蓋住
      if (norm < closestNorm) {
        closestNorm = norm;
        closestIdx = el.dataset.avatarIdx;
      }
    });
    // 反方向綁定：使用者用手滑輪播（不是點框）滑到別人時，主圖上的框也要跟著換
    if (closestIdx !== null) setFocusedAvatar(closestIdx);
  }

  // 捲動中持續重算（手動滑動、慣性捲動、scrollToAvatar 的 smooth 捲動過程
  // 都會連續觸發 scroll 事件），用 requestAnimationFrame 節流避免捲動時
  // 頻繁 reflow 造成手機卡頓
  function bindCoverflow(thumbCol) {
    let scheduled = false;
    const update = () => { scheduled = false; applyCoverflow(thumbCol); };
    thumbCol.addEventListener('scroll', () => {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(update);
    }, { passive: true });
    requestAnimationFrame(update); // 初始狀態也要套用一次，不用等使用者先滑一下
  }

  window.addEventListener('resize', () => {
    document.querySelectorAll('.thumb-col').forEach(applyCoverflow);
  });

  // 預覽模式點頭像先開燈箱放大看，不直接下載——用高解析度版本讓放大後還算清楚，
  // 下載鏈結也指到同一份高解析度圖，不是縮圖列表用的140px小圖。
  const previewModal = document.getElementById('previewModal');
  function openPreviewModal(cropIdx, isHerself) {
    const hiresSrc = `../qavatars-hires/${cropIdx}.png`;
    document.getElementById('previewModalImg').src = hiresSrc;
    document.getElementById('previewModalLabel').textContent = isHerself ? '★ 秀燕姐本人' : `Q版 #${cropIdx}`;
    document.getElementById('previewModalDl').href = hiresSrc;
    document.getElementById('previewModalDl').download = `Q版頭像_${cropIdx}.png`;
    document.getElementById('previewModalContent').classList.toggle('is-herself', isHerself);
    previewModal.classList.add('open');
  }
  function closePreviewModal() {
    previewModal.classList.remove('open');
  }
  document.getElementById('previewModalCloseBtn').addEventListener('click', closePreviewModal);
  document.querySelector('.preview-modal-backdrop').addEventListener('click', closePreviewModal);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePreviewModal(); });

  // 卡片捲到畫面裡「停留」到一定比例才觸發掃描辨識效果（不是邊緣一碰到就播，
  // 那樣快速滑過去時會太敏感），而且只播一次——重新整理頁面或重新搜尋
  // 才會再看到，避免使用者上下滑來滑去反覆播同一段動畫覺得煩。
  const revealObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        revealObserver.unobserve(entry.target);
      }
    }
  }, { threshold: 0.35 });

  function render(filterText) {
    currentFilter = filterText;
    main.innerHTML = '';
    const editMode = isEditMode();
    const onlyHerself = document.getElementById('onlyHerself').checked;
    const filtered = files
      .filter(f => !filterText || f.includes(filterText))
      .filter(f => !editMode || !onlyHerself || herselfMarks[f] !== undefined);
    document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';

    for (const file of filtered) {
      const { reject } = byFile[file];
      // 側欄縮圖依框選的 x 座標由左到右排序，跟大家在照片裡實際站的順序一致，
      // 找自己比原本「偵測順序」（跟畫面位置無關、看起來隨機）快很多
      const keep = [...byFile[file].keep].sort((a, b) => a.box[0] - b.box[0]);
      const card = document.createElement('div');
      card.className = 'card';

      const head = document.createElement('div');
      head.className = 'card-head';
      // 預覽模式不顯示「已選/未選」這種審核用語，一般參加者看不懂也用不到
      head.innerHTML = editMode
        ? `<span>檔名：<b>${file}</b></span><span>已選 ${keep.length} ／ 未選 ${reject.length}</span>`
        : `<span>${file}</span>`;
      card.appendChild(head);

      const body = document.createElement('div');
      body.className = 'card-body';
      card.appendChild(body);

      const imgwrap = document.createElement('div');
      imgwrap.className = 'imgwrap';
      const img = document.createElement('img');
      img.src = `../photos/${file}`;
      // 主要照片不用 lazy——跟 aspect-ratio 預設值一起是雙重保險，
      // 避免圖片本身尺寸未知時瀏覽器誤判「不在可視範圍」而卡住不載入
      imgwrap.appendChild(img);
      body.appendChild(imgwrap);

      if (keep.length) {
        const thumbCol = document.createElement('div');
        thumbCol.className = 'thumb-col';
        for (const [i, k] of keep.entries()) {
          const cropIdx = String(k.avatarIdx).padStart(4, '0');
          const isHerself = herselfMarks[file] === k.avatarIdx;

          if (editMode) {
            const pair = document.createElement('div');
            pair.className = 'thumb-pair';
            if (isHerself) pair.classList.add('is-herself');
            pair.innerHTML = `
              <div class="thumb-row">
                <div class="thumb-item">
                  <img src="../qavatar-crops/${cropIdx}.jpg" loading="lazy" onerror="this.closest('.thumb-item').classList.add('missing')">
                  <span>候選裁切</span>
                </div>
                <div class="thumb-arrow">→</div>
                <div class="thumb-item">
                  <img src="../qavatars/${cropIdx}.jpg" loading="lazy" onerror="this.closest('.thumb-item').classList.add('missing')">
                  <span>Q版 #${cropIdx}</span>
                </div>
              </div>
              <button type="button" class="herself-toggle ${isHerself ? 'on' : ''}">${isHerself ? '★ 秀燕姐本人' : '標記為秀燕姐本人'}</button>
              <a class="dl-btn" href="../qavatars-hires/${cropIdx}.png" download="Q版頭像_${cropIdx}.png">⬇ 下載高解析度（512px）</a>
            `;
            pair.querySelector('.herself-toggle').addEventListener('click', () => toggleHerself(file, k.avatarIdx));
            thumbCol.appendChild(pair);
          } else {
            // 預覽模式：一般參加者只需要看到自己的Q版大頭貼，可以直接下載，
            // 不需要裁切對照、不需要標記按鈕
            const avatar = document.createElement('div');
            avatar.className = 'simple-avatar revealable' + (isHerself ? ' is-herself' : '');
            avatar.dataset.avatarIdx = k.avatarIdx; // 給點原圖框時定位用（見 scrollToAvatar）
            avatar.style.animationDelay = `${SCAN_DURATION_S + i * AVATAR_STAGGER_S}s`; // 主圖掃描完才開始逐一浮現
            // 淡入動畫播完就把「顯示」狀態直接寫死成行內樣式、拿掉 .revealable——
            // 不然之後點原圖框觸發 scrollToAvatar() 加 .ping class 時，.ping 也有
            // 自己的 animation 簡寫，會整個取代掉還掛在元素上的 avatarReveal，
            // 連帶讓它失去 forwards 保留的 opacity:1，退回 .revealable 原本
            // opacity:0 的靜態樣式，頭像瞬間「被隱藏」（就是這次回報的 bug）。
            avatar.addEventListener('animationend', (e) => {
              if (e.animationName === 'avatarReveal') {
                avatar.classList.remove('revealable');
                avatar.style.opacity = '1';
                avatar.style.transform = 'none';
                applyCoverflow(thumbCol); // 淡入剛結束會把 transform 歸零，緊接著套回聚焦縮放，不然會閃一下變回原尺寸
              }
              // ping 動畫沒設 forwards（下一次點擊要能重播同一顆），播完把 class
              // 自己清掉，避免使用者這次沒再點別的框時，class 一直卡在身上
              // （雖然視覺上動畫已經歸零，但語意上該是「沒有正在回應中」）
              if (e.animationName === 'avatarPing') {
                avatar.classList.remove('ping');
              }
            });
            avatar.innerHTML = `
              <button type="button" class="pair-imgs">
                <img src="../qavatar-crops/${cropIdx}.jpg" loading="lazy" alt="原圖" onerror="this.remove()">
                <div class="pair-divider"></div>
                <img src="../qavatars/${cropIdx}.jpg" loading="lazy" alt="Q版" onerror="this.closest('.simple-avatar').classList.add('missing')">
              </button>
              <span class="who">${isHerself ? '★ 秀燕姐本人' : '點圖放大'}</span>
            `;
            avatar.querySelector('.pair-imgs').addEventListener('click', () => openPreviewModal(cropIdx, isHerself));
            thumbCol.appendChild(avatar);
          }
        }
        if (!editMode) bindCoverflow(thumbCol);
        body.appendChild(thumbCol);
      }

      main.appendChild(card);

      img.addEventListener('load', () => {
        const w = img.naturalWidth, h = img.naturalHeight;
        // 明確用 aspect-ratio 撐開 imgwrap 高度，img 跟 svg 才能穩定用同一份
        // width:100%/height:100% 疊在一起，不受「auto高度容器的百分比高度」
        // 這種跨瀏覽器計算差異影響（手機版標註跑掉的成因）
        imgwrap.style.aspectRatio = `${w} / ${h}`;
        // viewBox 要用「原圖」尺寸（框選座標算出來的座標系），不是這裡載入的
        // 網頁壓縮版照片尺寸——兩者比例相同但像素數不同，用錯了框會整個偏出畫面外
        const [origW, origH] = photoDims[file] || [w, h];
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', `0 0 ${origW} ${origH}`);
        svg.setAttribute('preserveAspectRatio', 'none');

        // 桌機版掃描線是橫線縱掃（由上到下），框要依 y 座標算延遲；
        // 手機版是直線橫掃（由左到右），框要依 x 座標算延遲——斷點跟 CSS
        // 的 900px 媒體查詢一致，才會跟畫面上實際的掃描方向對得準
        const isMobileScan = window.innerWidth <= 900;
        const scanDelay = (x, y) => (isMobileScan ? x / origW : y / origH) * SCAN_DURATION_S;

        // 裁切範圍框、重疊模糊區、未選紅虛框都是審核用的除錯資訊，預覽模式不畫
        if (editMode) {
          // 先算每個「已選臉」的裁切範圍與其他臉的重疊(模糊)區域
          const allBoxes = [...keep, ...reject].map(f => f.box);
          for (const k of keep) {
            const crop = paddedCropRect(k.box);
            const cropEl = document.createElementNS(svg.namespaceURI, 'rect');
            cropEl.setAttribute('x', crop[0]); cropEl.setAttribute('y', crop[1]);
            cropEl.setAttribute('width', crop[2]); cropEl.setAttribute('height', crop[3]);
            cropEl.setAttribute('class', 'rect-crop');
            svg.appendChild(cropEl);

            for (const ob of allBoxes) {
              if (ob === k.box) continue;
              const ov = overlapRect(crop, ob);
              if (ov) {
                const blurEl = document.createElementNS(svg.namespaceURI, 'rect');
                blurEl.setAttribute('x', ov[0]); blurEl.setAttribute('y', ov[1]);
                blurEl.setAttribute('width', ov[2]); blurEl.setAttribute('height', ov[3]);
                blurEl.setAttribute('class', 'rect-blur');
                svg.appendChild(blurEl);
              }
            }
          }

          // 再畫未選（紅虛框）
          for (const r of reject) {
            const [x,y,bw,bh] = r.box;
            const el = document.createElementNS(svg.namespaceURI, 'rect');
            el.setAttribute('x', x); el.setAttribute('y', y);
            el.setAttribute('width', bw); el.setAttribute('height', bh);
            el.setAttribute('class', 'rect-rej');
            svg.appendChild(el);
          }
        }

        // 已選的框一定畫（不管哪個模式）：秀燕姐本人永遠用金框標出來方便大家辨認，
        // 其他參加者用綠框；只有編輯模式才能點擊切換標記。
        for (const k of keep) {
          const [x,y,bw,bh] = k.box;
          const isHerself = herselfMarks[file] === k.avatarIdx;
          const el = document.createElementNS(svg.namespaceURI, 'rect');
          el.setAttribute('x', x); el.setAttribute('y', y);
          el.setAttribute('width', bw); el.setAttribute('height', bh);
          el.setAttribute('class', isHerself ? 'rect-herself' : 'rect-keep');
          el.dataset.avatarIdx = k.avatarIdx; // 雙向綁定用：setFocusedAvatar 靠這個屬性找到對應的框
          if (editMode) {
            // 直接點照片上的框就能標記/取消，不用捲到旁邊縮圖清單去點按鈕，瀏覽80幾張時快很多
            el.addEventListener('click', () => toggleHerself(file, k.avatarIdx));
          } else {
            // 預覽模式點框不是標記，是把下面對應的Q版頭像捲到正中央方便對照
            el.addEventListener('click', () => scrollToAvatar(k.avatarIdx));
            // 框依 y 座標算出延遲時間，掃描線掃到這個高度時框才浮現（見上面
            // CSS 的 .card.revealed 說明），delay 算法跟掃描線的動畫時間軸共用同一個基準
            el.classList.add('revealable');
            el.style.animationDelay = `${scanDelay(x, y)}s`;
          }
          svg.appendChild(el);

          if (editMode) {
            const label = `${k.quality.toFixed(2)}`;
            const bg = document.createElementNS(svg.namespaceURI, 'rect');
            bg.setAttribute('x', x); bg.setAttribute('y', Math.max(0, y - 40));
            bg.setAttribute('width', 34 * label.length * 0.62 + 10);
            bg.setAttribute('height', 38);
            bg.setAttribute('class', 'label-bg');
            svg.appendChild(bg);
            const txt = document.createElementNS(svg.namespaceURI, 'text');
            txt.setAttribute('x', x + 6); txt.setAttribute('y', Math.max(0, y - 40) + 28);
            txt.setAttribute('class', 'label-text');
            txt.textContent = label;
            svg.appendChild(txt);
          } else {
            // 預覽模式的分數牌用圓角＋發光風格，跟框同一個延遲時間點浮現，
            // 呼應「偵測到、算出信心分數」的科技感，不是審核用的陽春黑底白字
            const label = `${k.quality.toFixed(2)}`;
            const delay = `${scanDelay(x, y)}s`;
            const badge = document.createElementNS(svg.namespaceURI, 'g');
            badge.setAttribute('class', 'score-badge' + (isHerself ? ' for-herself' : ''));
            badge.style.animationDelay = delay;
            const bg = document.createElementNS(svg.namespaceURI, 'rect');
            const bw2 = 30 * label.length * 0.62 + 14;
            bg.setAttribute('x', x); bg.setAttribute('y', Math.max(0, y - 36));
            bg.setAttribute('width', bw2); bg.setAttribute('height', 32);
            bg.setAttribute('rx', 8); bg.setAttribute('ry', 8);
            bg.setAttribute('class', 'score-badge-bg');
            badge.appendChild(bg);
            const txt = document.createElementNS(svg.namespaceURI, 'text');
            txt.setAttribute('x', x + 8); txt.setAttribute('y', Math.max(0, y - 36) + 23);
            txt.setAttribute('class', 'score-badge-text');
            txt.textContent = label;
            badge.appendChild(txt);
            svg.appendChild(badge);
          }
        }

        imgwrap.appendChild(svg);

        if (!editMode) {
          // 主圖圖片載入完成才知道 imgwrap 的實際尺寸，這時候加掃描線最保險
          const scanLine = document.createElement('div');
          scanLine.className = 'scan-line';
          imgwrap.appendChild(scanLine);
          revealObserver.observe(card); // 交給 IntersectionObserver 決定何時觸發掃描
        }
      });
    }
  }

  setEditMode(isEditMode()); // 套用 body.edit-mode class＋按鈕文字，跟 localStorage 記錄的模式同步
  render('');
  document.getElementById('search').addEventListener('input', (e) => render(e.target.value.trim()));
  document.getElementById('onlyHerself').addEventListener('change', () => render(currentFilter));
  document.getElementById('modeToggle').addEventListener('click', () => {
    setEditMode(!isEditMode());
    render(currentFilter);
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const entries = Object.entries(herselfMarks).sort((a, b) => a[1] - b[1]);
    const text = entries.map(([file, idx]) =>
      `${file}\tavatarIdx=${idx}\tqavatars/${String(idx).padStart(4, '0')}.jpg`
    ).join('\n');
    if (!text) { alert('目前還沒有標記任何一張秀燕姐本人的照片'); return; }
    try {
      await navigator.clipboard.writeText(text);
      alert(`已複製 ${entries.length} 筆到剪貼簿，貼給我就可以了`);
    } catch {
      prompt('自動複製失敗，請手動全選複製：', text);
    }
  });
}

main().catch(err => {
  document.getElementById('main').innerHTML =
    `<p style="color:#e05a4a;padding:20px">載入失敗：${err.message}（需透過 HTTP 伺服器開啟此頁，不能直接雙擊開檔案）</p>`;
});
</script>
</body>
</html>
